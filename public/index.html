<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<title>Software Company Manager</title>
	<link rel="stylesheet" href="./styles.css">
</head>
<body>
	<header>
		<h1>Software Company Manager</h1>
	</header>
	<main class="grid">
		<section class="section">
			<h2>Authentication</h2>
			<div id="userStatus" style="padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid var(--border); background: #0e1430;">
				<strong>Status:</strong> <span id="userStatusText">Checking...</span>
			</div>
			<div class="grid">
				<div class="row">
					<label for="email">Email</label>
					<input id="email" placeholder="email" />
				</div>
				<div class="row">
					<label for="password">Password</label>
					<input id="password" type="password" placeholder="password" />
				</div>
				<div class="actions">
					<button id="registerBtn" class="secondary">Register</button>
					<button id="loginBtn" class="primary">Login</button>
					<button id="refreshBtn" class="secondary">Refresh Token</button>
					<button id="logoutBtn" class="secondary">Logout</button>
				</div>
			</div>
		</section>

		<section class="section" id="createProjectSection">
			<h2>Create Project</h2>
			<div class="grid cols-2">
				<div class="grid">
					<div class="row">
						<label for="pName">Project name</label>
						<input id="pName" placeholder="e.g. CRM Platform" />
					</div>
					<div class="row">
						<label for="pClient">Customer</label>
						<input id="pClient" placeholder="e.g. Acme Inc." />
					</div>
				</div>
				<div class="grid">
					<div class="row">
						<label for="pStart">Start date</label>
						<input id="pStart" type="date" />
					</div>
					<div class="row">
						<label for="pEnd">End date</label>
						<input id="pEnd" type="date" />
					</div>
				</div>
			</div>
			<div class="actions">
				<button id="createProjectBtn" class="primary">Create Project</button>
				<span id="projectFormMsg" class="small"></span>
			</div>
		</section>

		<section class="section" id="createProgrammerSection">
			<h2>Create Programmer</h2>
			<div class="grid cols-2">
				<div class="grid">
					<div class="row">
						<label for="prProject">Project</label>
						<select id="prProject"></select>
					</div>
					<div class="row">
						<label for="prFirst">First name</label>
						<input id="prFirst" placeholder="e.g. Jane" />
					</div>
					<div class="row">
						<label for="prLast">Last name</label>
						<input id="prLast" placeholder="e.g. Doe" />
					</div>
					<div class="row">
						<label for="prMiddle">Patronymic</label>
						<input id="prMiddle" placeholder="e.g. M" />
					</div>
					<div class="row">
						<label for="prPos">Position</label>
						<input id="prPos" placeholder="e.g. Backend Dev" />
					</div>
				</div>
				<div class="grid">
					<div class="row">
						<label for="prStart">Work start</label>
						<input id="prStart" type="date" />
					</div>
					<div class="row">
						<label for="prEnd">Work end</label>
						<input id="prEnd" type="date" />
					</div>
					<div class="row">
						<label for="prRate">Hourly rate</label>
						<input id="prRate" type="number" step="0.01" placeholder="e.g. 50" />
					</div>
					<div class="row">
						<label for="prFull">Full-time</label>
						<select id="prFull">
							<option value="true">Yes</option>
							<option value="false">No (part-time)</option>
						</select>
					</div>
				</div>
			</div>
			<div class="actions">
				<button id="createProgrammerBtn" class="primary">Add Programmer</button>
				<span id="programmerFormMsg" class="small"></span>
			</div>
		</section>

		<section class="section" id="userManagementSection" style="display:none;">
			<h2>User Management (Admin Only)</h2>
			<div class="grid cols-2" style="margin-bottom:12px;">
				<div class="grid">
					<div class="row">
						<label for="uEmail">Email</label>
						<input id="uEmail" placeholder="user@example.com" />
					</div>
					<div class="row">
						<label for="uPassword">Password</label>
						<input id="uPassword" type="password" placeholder="password" />
					</div>
				</div>
			</div>
			<div class="actions">
				<button id="createUserBtn" class="primary">Create User</button>
				<button id="loadUsersBtn" class="secondary">Reload Users</button>
				<span id="userFormMsg" class="small"></span>
			</div>
			<div id="usersView" class="list"></div>
		</section>

		<section class="section">
			<h2>Projects</h2>
			<div class="actions" style="margin-bottom:8px;">
				<button id="loadProjectsBtn" class="secondary">Reload</button>
			</div>
			<div class="kpi" id="kpiBar" style="display:none;">
				<div class="card">
					<h3>Total Projects</h3>
					<div class="val" id="kpiProjects">0</div>
				</div>
				<div class="card">
					<h3>Total Programmers</h3>
					<div class="val" id="kpiProgrammers">0</div>
				</div>
				<div class="card">
					<h3>Total Salaries</h3>
					<div class="val" id="kpiSalaries">$0</div>
				</div>
				<div class="card">
					<h3>Total Project Value</h3>
					<div class="val" id="kpiValue">$0</div>
				</div>
			</div>
			<div id="projectsView" class="list"></div>
		</section>
	</main>

	<div id="modalOverlay" class="modal-overlay">
		<div class="modal">
			<div class="modal-header">
				<h3 id="modalTitle">Confirm Action</h3>
			</div>
			<div class="modal-body">
				<p id="modalMessage">Are you sure you want to proceed?</p>
			</div>
			<div class="modal-actions">
				<button id="modalCancel" class="secondary">Cancel</button>
				<button id="modalConfirm" class="danger">Confirm</button>
			</div>
		</div>
	</div>

	<script src="./app.js"></script>
</body>
</html>
